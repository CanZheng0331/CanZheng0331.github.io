<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blog · Can Zheng</title>
  <link rel="stylesheet" href="styles.css" />
  <meta name="color-scheme" content="light dark">
  <style>
    /* 调整 CSS 以实现全屏覆盖 */
    .post-list { list-style: none; padding: 0; }
    .post-list li { margin: 0.5rem 0; }
    .tag { 
      display: inline-block; 
      background: #444; 
      color: #fff; 
      padding: 2px 6px; 
      margin: 0 4px; 
      border-radius: 6px; 
      font-size: 0.8rem;
      cursor: pointer;
    }
    .search-box { margin: 1rem 0; }
    .modal {
      /* 关键：全屏覆盖并移除背景 */
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--bg, #fff); /* 使用与页面背景相同的颜色 */
      display: none; 
      /* 允许内容滚动 */
      overflow-y: auto;
      align-items: center;
      justify-content: center;
      z-index: 1000; /* 确保在最上层 */
    }
    .modal-content {
      /* 关键：内容也全屏 */
      background: var(--bg, #fff);
      color: var(--fg, #000);
      max-width: 100%;
      width: 100%;
      height: 100%;
      padding: 1rem 2rem;
      border-radius: 0;
      overflow-y: auto;
      max-height: 100vh;
      box-sizing: border-box; /* 确保 padding 包含在宽度内 */
    }
    .modal-close { 
        position: absolute;
        top: 1rem;
        left: 2rem;
        font-size: 1rem;
        cursor: pointer;
        padding: 5px 10px;
        background: #eee;
        border-radius: 6px;
        color: #333;
        text-decoration: none;
    }
    @media (max-width: 768px) {
        .modal-close {
            left: 1rem;
        }
        .modal-content {
            padding: 1rem;
        }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="navbar container">
      <a class="brand" href="index.html">Can Zheng</a>
      <nav>
        <a href="index.html">Home</a>
        <a href="biography.html">Biography</a>
        <a href="publications.html">Publications</a>
        <a href="blog.html" aria-current="page">Blog</a>
        <a href="photos.html">Photos</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="section">
      <h2>Blog Posts</h2>
      <input class="search-box" type="text" id="search" placeholder="搜索文章标题或内容…" />
      <ul id="post-list" class="post-list">
        <li><small class="muted">Loading…</small></li>
      </ul>
    </section>
  </main>

  <div id="modal" class="modal">
    <div class="modal-content card prose">
      <a href="#" id="modal-close" class="modal-close">Back</a>
      <h1 id="post-title" style="padding-top: 2rem;"></h1>
      <div id="post-tags"></div>
      <hr>
      <div id="post-content"></div>
    </div>
  </div>

  <footer class="footer">
    <div>© <span id="year"></span> Can Zheng · Built for GitHub Pages</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
      svg: { fontCache: 'global' }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    const posts = [
      {
        id: "hello-world",
        title: "Hello, World: Markdown + LaTeX Demo",
        tags: ["demo","latex"],
        file: "posts/hello-world.md"
      },
      {
        id: "otfs-notes",
        title: "Notes on OTFS",
        tags: ["OTFS","Signal Processing"],
        file: "posts/otfs-notes.md"
      }
    ];

    const list = document.getElementById("post-list");
    const modal = document.getElementById("modal");
    const modalClose = document.getElementById("modal-close");
    const postTitle = document.getElementById("post-title");
    const postTags = document.getElementById("post-tags");
    const postContent = document.getElementById("post-content");
    const searchBox = document.getElementById("search");

    // 渲染文章列表
    function renderList(filter="") {
      list.innerHTML = "";
      posts.forEach(post => {
        fetch(post.file).then(r => r.text()).then(text => {
          if (filter && !post.title.toLowerCase().includes(filter) && !text.toLowerCase().includes(filter)) return;
          const li = document.createElement("li");
          li.innerHTML = `<a href="#">${post.title}</a> 
            ${post.tags.map(t => `<span class="tag" data-tag="${t}">${t}</span>`).join(" ")}`;
          li.querySelector("a").onclick = (e) => {
            e.preventDefault(); // 阻止a标签默认跳转
            openPost(post, text);
          };
          li.querySelectorAll(".tag").forEach(tagEl => {
            tagEl.onclick = () => renderList(tagEl.dataset.tag.toLowerCase());
          });
          list.appendChild(li);
        });
      });
    }

    function openPost(post, markdown) {
      postTitle.textContent = post.title;
      postTags.innerHTML = post.tags.map(t => `<span class="tag">${t}</span>`).join(" ");
      postContent.innerHTML = marked.parse(markdown);
      MathJax.typesetPromise(); // 确保渲染 LaTeX
      modal.style.display = "flex";
      document.body.style.overflow = "hidden"; // 隐藏主页面的滚动条
    }

    modalClose.onclick = (e) => {
      e.preventDefault(); // 阻止链接默认行为
      modal.style.display = "none";
      document.body.style.overflow = "auto"; // 恢复主页面的滚动条
    };

    searchBox.oninput = () => renderList(searchBox.value.toLowerCase());

    renderList();
  </script>
</body>
</html>
