<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blog · Can Zheng</title>
  <link rel="stylesheet" href="styles.css" />
  <meta name="color-scheme" content="light dark">
  <style>
    /* 基础样式，与你原代码保持一致 */
    .post-list {
      list-style: none;
      padding: 0;
    }
    .post-list li {
      margin: 0.5rem 0;
    }
    .tag {
      display: inline-block;
      background: #444;
      color: #fff;
      padding: 2px 6px;
      margin: 0 4px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .search-box {
      margin: 1rem 0;
    }
    .modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--bg, #fff);
      display: none;
      overflow-y: auto;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-content {
      background: var(--bg, #fff);
      color: var(--fg, #000);
      max-width: 100%;
      width: 100%;
      height: 100%;
      padding: 1rem 2rem;
      border-radius: 0;
      overflow-y: auto;
      max-height: 100vh;
      box-sizing: border-box;
    }
    .modal-close {
      position: absolute;
      top: 1rem;
      left: 2rem;
      font-size: 1rem;
      cursor: pointer;
      padding: 5px 10px;
      background: #eee;
      border-radius: 6px;
      color: #333;
      text-decoration: none;
    }
    @media (max-width: 768px) {
      .modal-close { left: 1rem; }
      .modal-content { padding: 1rem; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="navbar container">
      <a class="brand" href="index.html">Can Zheng</a>
      <nav>
        <a href="index.html">Home</a>
        <a href="biography.html">Biography</a>
        <a href="publications.html">Publications</a>
        <a href="blog.html" aria-current="page">Blog</a>
        <a href="photos.html">Photos</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="section">
      <h2>Blog Posts</h2>
      <input class="search-box" type="text" id="search" placeholder="搜索文章标题或内容…" />
      <ul id="post-list" class="post-list">
        <li><small class="muted">Loading…</small></li>
      </ul>
    </section>
  </main>

  <div id="modal" class="modal">
    <div class="modal-content card prose">
      <a href="#" id="modal-close" class="modal-close">返回</a>
      <h1 id="post-title" style="padding-top: 2rem;"></h1>
      <div id="post-tags"></div>
      <hr>
      <div id="post-content"></div>
    </div>
  </div>

  <footer class="footer">
    <div>© <span id="year"></span> Can Zheng · Built for GitHub Pages</div>
  </footer>

  <script>
    // MathJax 配置
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true
      },
      options: {
        ignoreHtmlClass: '.*',
        processHtmlClass: 'prose'
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    // 关键更改：配置 Marked.js
    marked.use({
        gfm: true, // 启用 GitHub Flavored Markdown
        mangle: false, // 禁用可能会破坏公式的混淆处理
        headerIds: false // 禁用自动生成标题ID，与你的代码无关但一般推荐
    });

    const posts = [
      {
        id: "hello-world",
        title: "Hello, World: Markdown + LaTeX Demo",
        tags: ["demo", "latex"],
        file: "posts/hello-world.md"
      },
      {
        id: "otfs-notes",
        title: "Notes on OTFS",
        tags: ["OTFS", "Signal Processing"],
        file: "posts/otfs-notes.md"
      }
    ];

    const list = document.getElementById("post-list");
    const modal = document.getElementById("modal");
    const modalClose = document.getElementById("modal-close");
    const postTitle = document.getElementById("post-title");
    const postTags = document.getElementById("post-tags");
    const postContent = document.getElementById("post-content");
    const searchBox = document.getElementById("search");

    function renderList(textFilter = "", tagFilter = "") {
      list.innerHTML = "";
      let hasResults = false;
      posts.forEach(post => {
        fetch(post.file).then(r => r.text()).then(text => {
          const titleMatch = post.title.toLowerCase().includes(textFilter.toLowerCase());
          const contentMatch = text.toLowerCase().includes(textFilter.toLowerCase());
          const tagMatch = tagFilter === "" || post.tags.includes(tagFilter);

          if ((textFilter && (titleMatch || contentMatch) && tagMatch) || (!textFilter && tagMatch)) {
            hasResults = true;
            const li = document.createElement("li");
            li.innerHTML = `<a href="#">${post.title}</a>
                            ${post.tags.map(t => `<span class="tag" data-tag="${t}">${t}</span>`).join(" ")}`;
            li.querySelector("a").onclick = (e) => {
              e.preventDefault();
              openPost(post, text);
            };
            li.querySelectorAll(".tag").forEach(tagEl => {
              tagEl.onclick = () => {
                searchBox.value = "";
                renderList("", tagEl.dataset.tag);
              };
            });
            list.appendChild(li);
          }
        });
      });
      setTimeout(() => {
        if (!hasResults && list.childElementCount === 0) {
          list.innerHTML = "<li><small class='muted'>没有找到相关文章。</small></li>";
        }
      }, 500);
    }

    function openPost(post, markdown) {
      postTitle.textContent = post.title;
      postTags.innerHTML = post.tags.map(t => `<span class="tag">${t}</span>`).join(" ");
      
      const html = marked.parse(markdown);
      postContent.innerHTML = html;
      
      MathJax.typesetPromise();

      modal.style.display = "flex";
      document.body.style.overflow = "hidden";
      window.scrollTo(0, 0);
    }

    modalClose.onclick = (e) => {
      e.preventDefault();
      modal.style.display = "none";
      document.body.style.overflow = "auto";
    };

    searchBox.oninput = () => renderList(searchBox.value.toLowerCase());

    renderList();
  </script>
</body>
</html>
