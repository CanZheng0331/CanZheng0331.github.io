<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blog · Can Zheng</title>
  <link rel="stylesheet" href="styles.css" />
  <meta name="color-scheme" content="light dark">
  <style>
    .post-list { list-style: none; padding: 0; }
    .post-list li { margin: 0.5rem 0; }
    .tag { display: inline-block; background: #444; color: #fff; padding: 2px 6px; margin: 0 4px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; }
    .search-box { margin: 1rem 0; }

    /* 避免双滚动条：外层不滚动，内容层滚动 */
    .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg, #fff); display: none; overflow: hidden; align-items: center; justify-content: center; z-index: 1000; }
    .modal-content { background: var(--bg, #fff); color: var(--fg, #000); max-width: 100%; width: 100%; height: 100%; padding: 1rem 2rem; border-radius: 0; overflow-y: auto; max-height: 100vh; box-sizing: border-box; }

    /* 返回按钮：小按钮，左上角固定；覆盖任何全局 a{display:block;width:100%} */
    .modal .modal-content > .modal-close {
      position: fixed;
      top: 0.75rem;
      left: 0.75rem;

      display: inline-flex !important;
      width: auto !important;
      max-width: none !important;

      align-items: center;
      justify-content: center;
      height: 30px;
      padding: 0 10px;
      font-size: 0.9rem;
      line-height: 1;

      background: #eee;
      color: #333;
      border: 1px solid #ddd;
      border-radius: 6px;
      text-decoration: none;
      box-sizing: border-box;

      opacity: 0.5;
      transition: opacity .2s ease;
      z-index: 1001;
      pointer-events: auto;
    }
    .modal .modal-content > .modal-close:hover,
    .modal .modal-content > .modal-close:focus { opacity: 1; }

    @media (max-width: 768px) {
      .modal-content { padding: 1rem; }
      .modal .modal-content > .modal-close { top: 0.6rem; left: 0.6rem; height: 28px; padding: 0 8px; font-size: 0.9rem; }
    }

    /* 关键修复：强制块/行内显示（用更强选择器绑定 #post-content），压过外部样式 */
    #post-content mjx-container[display="true"]  {
      display: block !important;
      margin: .8em 0 !important;
      text-align: center;                 /* 可选：公式居中 */
    }
    #post-content mjx-container[display="false"] {
      display: inline-block !important;
      margin: 0 .1em !important;
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="navbar container">
      <a class="brand" href="index.html">Can Zheng</a>
      <nav>
        <a href="index.html">Home</a>
        <a href="biography.html">Biography</a>
        <a href="publications.html">Publications</a>
        <a href="blog.html" aria-current="page">Blog</a>
        <a href="photos.html">Photos</a>
      </nav>
    </div>
  </header>
  <main class="container">
    <section class="section">
      <h2>Blog Posts</h2>
      <input class="search-box" type="text" id="search" placeholder="Search..." />
      <ul id="post-list" class="post-list">
        <li><small class="muted">Loading…</small></li>
      </ul>
    </section>
  </main>
  <div id="modal" class="modal">
    <div class="modal-content card prose">
      <a href="#" id="modal-close" class="modal-close" aria-label="Back">Back</a>
      <h1 id="post-title" style="padding-top: 2rem;"></h1>
      <div id="post-tags"></div>
      <hr>
      <div id="post-content"></div>
    </div>
  </div>
  <footer class="footer">
    <div>© <span id="year"></span> Can Zheng · Built for GitHub Pages</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    // MathJax：保留 inline/display 设置，并加载 textmacros 以支持 \textsf 等
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true,
        packages: {'[+]': ['textmacros']}
      },
      loader: { load: ['[tex]/textmacros'] },
      options: { /* 默认：跳过 <code>/<pre>，其余正常处理 */ }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    const posts = [
      { id: "Wireless-communications", title: "[Chinese] Notes on Wireless Communications by Andrea Goldsmith", tags: ["Wireless Communications", "Textbook"], file: "posts/Wireless-communications.md" },
      { id: "otfs-notes", title: "[Chinese] Notes on OTFS", tags: ["OTFS", "Signal Processing"], file: "posts/otfs-notes.md" },
      { id: "sats", title: "[Chinese] Notes on Multi-Satellite Cooperative Networks (Cell-Free Non-Terrestrial Networks)", tags: ["Satellite Communications", "Paper Summarization"], file: "posts/sats.md" },
      { id: "LLM_BBO", title: "[Chinese] Notes on LLM for Black-Box Optimization", tags: ["Large Language Model", "Optimization", "Paper Summarization"], file: "posts/LLM_BBO.md" }
    ];

    const list = document.getElementById("post-list");
    const modal = document.getElementById("modal");
    const modalClose = document.getElementById("modal-close");
    const postTitle = document.getElementById("post-title");
    const postTags = document.getElementById("post-tags");
    const postContent = document.getElementById("post-content");
    const searchBox = document.getElementById("search");

    // —— 数学内容保护：避免 Markdown 误处理 '_' '*' 等 —— //
    function extractMath(md) {
      const chunks = [];
      let out = '';
      let i = 0;

      const pushToken = (text) => {
        const key = `@@MATH_${chunks.length}@@`;
        chunks.push(text);
        return key;
      };

      while (i < md.length) {
        if (md.startsWith('$$', i)) { // $$...$$
          const j = md.indexOf('$$', i + 2);
          if (j !== -1) { out += pushToken(md.slice(i, j + 2)); i = j + 2; continue; }
        }
        if (md.startsWith('\\[', i)) { // \[...\]
          const j = md.indexOf('\\]', i + 2);
          if (j !== -1) { out += pushToken(md.slice(i, j + 2)); i = j + 2; continue; }
        }
        if (md.startsWith('\\(', i)) { // \(...\)
          const j = md.indexOf('\\)', i + 2);
          if (j !== -1) { out += pushToken(md.slice(i, j + 2)); i = j + 2; continue; }
        }
        if (md[i] === '$' && md[i+1] !== '$') { // $...$
          let j = i + 1;
          while (j < md.length) {
            if (md[j] === '\\') { j += 2; continue; }
            if (md[j] === '$') break;
            j++;
          }
          if (j < md.length && md[j] === '$') { out += pushToken(md.slice(i, j + 1)); i = j + 1; continue; }
        }
        out += md[i++];
      }
      return { masked: out, chunks };
    }
    function restoreMath(html, chunks) {
      let out = html;
      chunks.forEach((raw, idx) => { out = out.replaceAll(`@@MATH_${idx}@@`, raw); });
      return out;
    }

    function renderList(textFilter = "", tagFilter = "") {
      list.innerHTML = "";

      const filteredPosts = posts.filter(post => {
        const titleMatch = post.title.toLowerCase().includes(textFilter.toLowerCase());
        const tagMatch = tagFilter === "" || post.tags.includes(tagFilter);
        return (textFilter && titleMatch && tagMatch) || (!textFilter && tagMatch);
      });

      if (filteredPosts.length === 0) {
        list.innerHTML = "<li><small class='muted'>Not Found.</small></li>";
        return;
      }

      filteredPosts.forEach(post => {
        const li = document.createElement("li");
        li.innerHTML = `<a href="#">${post.title}</a>${post.tags.map(t => `<span class="tag" data-tag="${t}">${t}</span>`).join(" ")}`;

        li.querySelector("a").onclick = (e) => {
          e.preventDefault();
          fetch(post.file)
            .then(r => r.text())
            .then(markdown => openPost(post, markdown))
            .catch(error => console.error("Error fetching post file:", error));
        };

        li.querySelectorAll(".tag").forEach(tagEl => {
          tagEl.onclick = () => {
            searchBox.value = "";
            renderList("", tagEl.dataset.tag);
          };
        });

        list.appendChild(li);
      });
    }

    async function typesetPostContent() {
      if (!window.MathJax) return;
      try {
        if (MathJax.startup && MathJax.startup.promise) await MathJax.startup.promise;
        if (MathJax.texReset) MathJax.texReset();
        if (MathJax.typesetClear) MathJax.typesetClear([postContent]);
        await MathJax.typesetPromise([postContent]);
      } catch (err) {
        await new Promise(requestAnimationFrame);
        try {
          if (MathJax.texReset) MathJax.texReset();
          if (MathJax.typesetClear) MathJax.typesetClear([postContent]);
          await MathJax.typesetPromise([postContent]);
        } catch (e2) { console.warn("MathJax typeset failed:", e2); }
      }
    }

    async function openPost(post, markdown) {
      postTitle.textContent = post.title;
      postTags.innerHTML = post.tags.map(t => `<span class="tag">${t}</span>`).join(" ");

      // 保护数学 → Markdown → 还原
      const { masked, chunks } = extractMath(markdown);
      const htmlMasked = marked.parse(masked);
      const html = restoreMath(htmlMasked, chunks);
      postContent.innerHTML = html;

      // 显示 modal（避免 display:none 时测量失败）
      modal.style.display = "flex";
      document.body.style.overflow = "hidden";
      window.scrollTo(0, 0);

      // 等一帧确保布局
      await new Promise(requestAnimationFrame);

      // MathJax 渲染
      await typesetPostContent();
    }

    modalClose.onclick = (e) => {
      e.preventDefault();
      modal.style.display = "none";
      document.body.style.overflow = "auto";
      postContent.innerHTML = "";
      postTitle.textContent = "";
    };

    searchBox.oninput = () => renderList(searchBox.value.toLowerCase());

    // 初始化
    renderList();
  </script>
</body>
</html>
