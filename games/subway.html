<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Subway Run 3D - Gemini Edition</title>
    <style>
        body { margin: 0; overflow: hidden; background: #2f3640; font-family: 'Segoe UI', Tahoma, sans-serif; }
        #game-ui { position: absolute; top: 20px; left: 20px; color: #fff; text-shadow: 2px 2px #000; z-index: 10; display: none; }
        #score-label { font-size: 18px; color: #ccc; letter-spacing: 1px; }
        #score-val { font-size: 48px; font-weight: 900; color: #fbc531; }
        #main-menu {
            position: absolute; width: 100%; height: 100%; display: flex; flex-direction: column;
            align-items: center; justify-content: center; background: rgba(0,0,0,0.85); z-index: 100; color: white;
        }
        h1 { font-size: 80px; margin-bottom: 0; color: #fbc531; text-transform: uppercase; letter-spacing: 8px; margin-top: -50px; }
        .tagline { font-size: 16px; color: #aaa; font-style: italic; }
        .menu-btn {
            background: #fbc531; border: none; padding: 15px 50px; font-size: 24px; font-weight: bold;
            border-radius: 50px; cursor: pointer; margin: 15px; transition: 0.3s; width: 300px;
            color: #222; text-transform: uppercase;
        }
        .menu-btn:hover { transform: scale(1.05); background: #e1b12c; }
        .version { position: absolute; bottom: 20px; right: 20px; color: rgba(255,255,255,0.4); font-size: 14px; }
        #modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 200;
        }
        #how-to-play-modal {
            width: 400px; background: #2d3436; border: 3px solid #fbc531; padding: 30px; 
            border-radius: 20px; position: relative; color: white;
        }
        #close-modal { position: absolute; top: 15px; right: 20px; font-size: 30px; cursor: pointer; color: #aaa; }
        h3 { color: #fbc531; margin-top: 0; font-size: 24px; border-bottom: 1px solid #444; padding-bottom: 10px; }
        .control-row { display: flex; justify-content: space-between; margin: 15px 0; font-size: 18px; }
        .key { background: #444; padding: 2px 8px; border-radius: 4px; color: #fbc531; }
        #game-over {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #000; color: #fff; padding: 50px; border-radius: 30px;
            text-align: center; display: none; border: 4px solid #fbc531; z-index: 150;
        }
    </style>
</head>
<body>

<div id="main-menu">
    <h1>SUBWAY RUN</h1>
    <p class="tagline" style="margin-top: 20px; margin-bottom: 0;">Collaborated with Gemini 3 Pro</p>
    <div style="margin-top: 40px;">
        <button class="menu-btn" onclick="startGame()">Start Game</button><br>
        <button class="menu-btn" style="background:#487eb0; color:white;" onclick="openModal()">Instructions</button>
    </div>
    <div class="version">v1.0.0, 260214</div>
</div>

<div id="modal-overlay">
    <div id="how-to-play-modal">
        <span id="close-modal" onclick="closeModal()">&times;</span>
        <h3>How to Play</h3>
        <div class="control-row"><span>Jump / Climb Train</span> <span class="key">UP / SPACE</span></div>
        <div class="control-row"><span>Slide / Fast Fall</span> <span class="key">DOWN / S</span></div>
        <div class="control-row"><span>Move Left/Right</span> <span class="key">LEFT / RIGHT</span></div>
        <p style="font-size: 14px; color: #888; margin-top: 20px;">Avoid obstacles and collect coins on the road or train roofs!</p>
    </div>
</div>

<div id="game-ui">
    <div id="score-label">GOLD COLLECTED</div>
    <div id="score-val">0</div>
</div>

<div id="game-over">
    <h2 style="font-size: 40px; margin: 0;">CRASHED!</h2>
    <p style="font-size: 18px; margin-top: 10px; color: #aaa;">Total Gold Collected</p>
    <div id="final-gold" style="font-size: 70px; color: #fbc531; margin: 20px 0;">0</div>
    <button class="menu-btn" onclick="location.reload()">Try Again</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
const CONFIG = {
    lanes: [-5, 0, 5],
    initialSpeed: 0.005,
    speedMax: 0.007,
    speedStep: 0.000001,
    gravity: 0.005,
    jumpForce: 0.3,
    playerYOffset: 1.0
};

let scene, camera, renderer, player, ground, texture;
let obstacles = [], coins = [], trains = [];
let isPlaying = false, isGameOver = false, goldCount = 0;
let speed = CONFIG.initialSpeed;
let targetLane = 1;
let vVel = 0, isJumping = false;

init();
animate();

function init() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1e272e);
    scene.fog = new THREE.Fog(0x1e272e, 40, 160);

    camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.set(0, 10, 22);
    camera.lookAt(0, 2, 0);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const sun = new THREE.DirectionalLight(0xffffff, 1);
    sun.position.set(10, 30, 20);
    sun.castShadow = true;
    scene.add(sun);

    const pGeo = new THREE.BoxGeometry(1.4, 2, 1);
    const pMat = new THREE.MeshPhongMaterial({color: 0xee5253});
    player = new THREE.Mesh(pGeo, pMat);
    player.position.y = CONFIG.playerYOffset;
    player.castShadow = true;
    scene.add(player);

    const canv = document.createElement('canvas');
    canv.width = 128; canv.height = 128;
    const ctx = canv.getContext('2d');
    ctx.fillStyle = '#222'; ctx.fillRect(0,0,128,128);
    ctx.fillStyle = '#444'; ctx.fillRect(60, 0, 8, 128);
    texture = new THREE.CanvasTexture(canv);
    texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
    texture.repeat.set(1, 15);
    ground = new THREE.Mesh(new THREE.PlaneGeometry(20, 600), new THREE.MeshPhongMaterial({map: texture}));
    ground.rotation.x = -Math.PI/2;
    scene.add(ground);
}

function openModal() { document.getElementById('modal-overlay').style.display = 'flex'; }
function closeModal() { document.getElementById('modal-overlay').style.display = 'none'; }

function startGame() {
    document.getElementById('main-menu').style.display = 'none';
    document.getElementById('game-ui').style.display = 'block';
    isPlaying = true;
    spawnController();
}

function spawnController() {
    if(!isPlaying || isGameOver) return;
    const r = Math.random();
    const lane = CONFIG.lanes[Math.floor(Math.random()*3)];
    if(r < 0.45) spawnTrain(lane);
    else if(r < 0.85) spawnObstacle(lane);
    else spawnCoinGroup(lane, 1.8);
    let interval = 1300 - (speed * 1200);
    setTimeout(spawnController, Math.max(interval, 500));
}

function spawnTrain(lane) {
    const train = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(4.2, 4.5, 45), new THREE.MeshPhongMaterial({color: 0x2980b9}));
    body.position.y = 2.25;
    train.add(body);
    const roof = new THREE.Mesh(new THREE.BoxGeometry(4.3, 0.2, 45), new THREE.MeshPhongMaterial({color: 0x34495e}));
    roof.position.y = 4.6;
    train.add(roof);
    train.position.set(lane, 0, -200);
    scene.add(train);
    trains.push(train);
    if(Math.random() > 0.4) spawnCoinGroup(lane, 6.2, -200);
}

function spawnObstacle(lane) {
    const isHigh = Math.random() > 0.5;
    const height = isHigh ? 0.8 : 1.8;
    const geo = new THREE.BoxGeometry(4.5, height, 1);
    const mat = new THREE.MeshPhongMaterial({color: isHigh ? 0x9c88ff : 0xff4757});
    const obs = new THREE.Mesh(geo, mat);
    obs.position.set(lane, isHigh ? 3.8 : height/2, -180);
    obs.userData = { height: height, isHigh: isHigh };
    scene.add(obs);
    obstacles.push(obs);
}

function spawnCoinGroup(lane, yHeight, zStart = -180) {
    const count = 6;
    for(let i=0; i<count; i++) {
        setTimeout(() => {
            if(isGameOver) return;
            const coin = new THREE.Mesh(new THREE.TorusGeometry(0.5, 0.15, 8, 12), new THREE.MeshPhongMaterial({color: 0xfbc531, emissive: 0xfbc531, emissiveIntensity: 0.3}));
            coin.position.set(lane, yHeight, zStart - (i * 4.5));
            scene.add(coin);
            coins.push(coin);
        }, i * 50);
    }
}

function animate() {
    requestAnimationFrame(animate);
    if(!isPlaying || isGameOver) return;

    if(speed < CONFIG.speedMax) speed += CONFIG.speedStep;
    texture.offset.y += speed * 0.45;

    player.position.x = THREE.MathUtils.lerp(player.position.x, CONFIG.lanes[targetLane], 0.15);

    let currentFloor = 0; 

    // Train Logic
    trains.forEach((t, i) => {
        t.position.z += speed * 25;
        const dx = Math.abs(player.position.x - t.position.x);
        const dz = Math.abs(player.position.z - t.position.z);
        if(dx < 2.3 && dz < 22.5) {
            if(player.position.y >= 4.2) currentFloor = 4.6; 
            else endGame();
        }
        if(t.position.z > 60) { scene.remove(t); trains.splice(i,1); }
    });

    // Obstacles Logic with Elevation Check
    obstacles.forEach((o, i) => {
        o.position.z += speed * 25;
        const dx = Math.abs(player.position.x - o.position.x);
        const dz = Math.abs(player.position.z - o.position.z);

        // Horizontal hit box
        if (dx < 2.0 && dz < 1.0) {
            const obsTop = o.position.y + o.userData.height / 2;
            const playerFeet = player.position.y - 1.0; // Assume player height is 2

            // If feet are significantly above the obstacle top, treat as stepping over
            if (playerFeet >= obsTop - 0.2) {
                // Potential to set currentFloor = obsTop here if you want to stand on hurdles
                // For hurdles, we usually just let the player pass over
            } else if (!o.userData.isHigh || (o.userData.isHigh && playerFeet + 2.0 > o.position.y - o.userData.height / 2)) {
                // Logic for high obstacles (must slide under) or normal collision
                if (!(o.userData.isHigh && player.scale.y < 0.6)) {
                    endGame();
                }
            }
        }
        if(o.position.z > 40) { scene.remove(o); obstacles.splice(i,1); }
    });

    // Physics
    if(isJumping) {
        player.position.y += vVel;
        vVel -= CONFIG.gravity;
        if(player.position.y <= currentFloor + CONFIG.playerYOffset) {
            player.position.y = currentFloor + CONFIG.playerYOffset;
            isJumping = false;
            vVel = 0;
        }
    } else {
        if(player.position.y > currentFloor + CONFIG.playerYOffset) {
            isJumping = true;
            vVel = -0.01; 
        } else {
            player.position.y = currentFloor + CONFIG.playerYOffset;
        }
    }

    // Coins
    for(let i=coins.length-1; i>=0; i--) {
        const c = coins[i];
        c.position.z += speed * 25;
        c.rotation.y += 0.1;
        if(player.position.distanceTo(c.position) < 2.5) {
            goldCount++;
            document.getElementById('score-val').innerText = goldCount;
            scene.remove(c);
            coins.splice(i, 1);
        } else if(c.position.z > 40) { scene.remove(c); coins.splice(i, 1); }
    }
    renderer.render(scene, camera);
}

function endGame() {
    isGameOver = true;
    document.getElementById('game-over').style.display = 'block';
    document.getElementById('final-gold').innerText = goldCount;
}

window.addEventListener('keydown', (e) => {
    if(!isPlaying || isGameOver) return;
    if(e.code === 'ArrowLeft' || e.code === 'KeyA') if(targetLane > 0) targetLane--;
    if(e.code === 'ArrowRight' || e.code === 'KeyD') if(targetLane < 2) targetLane++;
    if((e.code === 'Space' || e.code === 'ArrowUp') && !isJumping) {
        vVel = CONFIG.jumpForce;
        isJumping = true;
    }
    if(e.code === 'ArrowDown' || e.code === 'KeyS') {
        if(isJumping) vVel = -0.5;
        else {
            player.scale.y = 0.5;
            player.position.y -= 0.5;
            setTimeout(() => { player.scale.y = 1; }, 600);
        }
    }
});
</script>
  <script src="../site.js?v=20260614-worker-stats"></script>
</body>
</html>
