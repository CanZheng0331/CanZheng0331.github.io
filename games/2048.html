<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048 - Gemini Edition</title>
    <style>
        :root {
            --bg-color: #1a1a2e;
            --container-bg: #16213e;
            --grid-bg: #0f3460;
            --primary: #fbc531;
            --cell-empty: rgba(255, 255, 255, 0.05);
            --radius: 8px;
            --tile-size: 75px;
            --tile-gap: 12px;
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            background-color: var(--bg-color);
            color: white;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        /* Menu Overlay */
        #menu-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #1a2a3a 0%, #000000 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 1000; text-align: center; transition: opacity 0.5s;
        }

        h1.main-title { font-size: 5rem; margin: 0; letter-spacing: 10px; color: var(--primary); text-shadow: 0 0 30px rgba(251,197,49,0.4); }
        .tagline { font-size: 1rem; color: #7f8c8d; margin-top: 10px; font-style: italic; }

        .btn-group { margin-top: 50px; display: flex; flex-direction: column; gap: 15px; }
        .main-btn {
            padding: 15px 50px; font-size: 1.1rem; border: none; border-radius: 30px;
            cursor: pointer; transition: all 0.3s; font-weight: bold; width: 280px;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .btn-start { background: var(--primary); color: #222; box-shadow: 0 4px 15px rgba(251,197,49,0.3); }
        .btn-start:hover { transform: scale(1.05); background: #f1c40f; }
        .btn-info { background: transparent; color: white; border: 2px solid rgba(255,255,255,0.3); }
        .btn-info:hover { background: rgba(255,255,255,0.1); border-color: white; }

        /* Modal */
        #modal {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 80%; max-width: 400px; background: white; color: #333; padding: 30px;
            border-radius: 20px; z-index: 2000; box-shadow: 0 25px 70px rgba(0,0,0,0.5);
        }
        #modal h3 { margin-top: 0; color: #16213e; border-left: 5px solid var(--primary); padding-left: 15px; }
        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 24px; cursor: pointer; color: #ccc; }

        /* Game Interface */
        #game-ui { opacity: 0; transition: opacity 0.8s; display: flex; flex-direction: column; align-items: center; }
        
        .header { width: 360px; display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px; }
        .score-box { background: var(--container-bg); padding: 10px 25px; border-radius: var(--radius); text-align: center; border: 1px solid rgba(255,255,255,0.1); }
        .score-label { font-size: 11px; color: #aaa; text-transform: uppercase; display: block; letter-spacing: 1px; }
        .score-val { font-size: 24px; font-weight: bold; color: var(--primary); }

        /* Board Container */
        #grid-container {
            width: 360px; height: 360px;
            background-color: var(--grid-bg);
            border-radius: 12px;
            position: relative; /* All children use absolute for precision */
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        }

        /* Fixed Background Cells for alignment */
        .bg-cell {
            position: absolute;
            width: var(--tile-size);
            height: var(--tile-size);
            background: var(--cell-empty);
            border-radius: var(--radius);
            z-index: 1;
        }

        /* Tiles */
        .tile {
            position: absolute;
            width: var(--tile-size);
            height: var(--tile-size);
            border-radius: var(--radius);
            display: flex; align-items: center; justify-content: center;
            font-size: 32px; font-weight: 900;
            transition: all 0.12s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 10;
        }

        .tile-2 { background: #eee4da; color: #776e65; }
        .tile-4 { background: #ede0c8; color: #776e65; }
        .tile-8 { background: #f2b179; color: white; }
        .tile-16 { background: #f59563; color: white; }
        .tile-32 { background: #f67c5f; color: white; }
        .tile-64 { background: #f65e3b; color: white; }
        .tile-128 { background: #edcf72; color: white; box-shadow: 0 0 10px #edcf72; font-size: 28px; }
        .tile-256 { background: #edcc61; color: white; box-shadow: 0 0 15px #edcc61; font-size: 28px; }
        .tile-512 { background: #edc850; color: white; font-size: 28px; }
        .tile-1024 { background: #edc53f; color: white; font-size: 24px; }
        .tile-2048 { background: var(--primary); color: white; font-size: 24px; box-shadow: 0 0 25px var(--primary); }

        /* Overlay */
        #game-result {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 52, 96, 0.9); border-radius: 12px;
            flex-direction: column; align-items: center; justify-content: center; z-index: 100;
        }

        .version { position: fixed; bottom: 20px; right: 20px; font-size: 12px; color: #444; font-family: monospace; }
    </style>
</head>
<body>

    <div id="menu-overlay">
        <h1 class="main-title">2048</h1>
        <p class="tagline">Collaborated with Gemini 3 Pro</p>
        <div class="btn-group">
            <button class="main-btn btn-start" onclick="startGame()">Start Game</button>
            <button class="main-btn btn-info" onclick="toggleModal(true)">Instructions</button>
        </div>
    </div>

    <div id="modal">
        <span class="close-btn" onclick="toggleModal(false)">&times;</span>
        <h3>HOW TO PLAY</h3>
        <p style="line-height: 1.6; font-size: 0.95rem;">
            • Use <b>WASD</b> or <b>Arrow Keys</b> to move tiles.<br>
            • When two tiles with the same number touch, they <b>merge</b> into one!<br>
            • Reach <b>2048</b> to win the game.
        </p>
        <button class="main-btn btn-start" style="width:100%; margin-top:10px;" onclick="toggleModal(false)">Got it!</button>
    </div>

    <div id="game-ui">
        <div class="header">
            <div>
                <h2 style="margin:0; color:var(--primary); letter-spacing: 1px;">2048</h2>
                <p style="margin:0; font-size:12px; color:#7f8c8d;">Join the numbers to reach 2048!</p>
            </div>
            <div class="score-box">
                <span class="score-label">Score</span>
                <span id="score-val" class="score-val">0</span>
            </div>
        </div>

        <div id="grid-container">
            <div id="game-result">
                <h2 id="result-title" style="font-size: 3rem; margin: 0; letter-spacing: 2px;"></h2>
                <button class="main-btn btn-start" onclick="resetGame()" style="margin-top:20px;">Try Again</button>
            </div>
        </div>
    </div>

    <div class="version">v1.0.0, 260215</div>

<script>
    let board = [];
    let score = 0;
    const size = 4;
    const gap = 12;
    const tileSize = 75;

    // Fixed coordination function to ensure perfect alignment
    const getPos = (index) => gap + index * (tileSize + gap);

    function toggleModal(show) {
        document.getElementById('modal').style.display = show ? 'block' : 'none';
    }

    function startGame() {
        const menu = document.getElementById('menu-overlay');
        menu.style.opacity = '0';
        setTimeout(() => {
            menu.style.display = 'none';
            document.getElementById('game-ui').style.opacity = '1';
            createBackground();
            initGame();
        }, 500);
    }

    // Generate background cells once
    function createBackground() {
        const container = document.getElementById('grid-container');
        for(let r=0; r<size; r++) {
            for(let c=0; c<size; c++) {
                const bgCell = document.createElement('div');
                bgCell.className = 'bg-cell';
                bgCell.style.top = `${getPos(r)}px`;
                bgCell.style.left = `${getPos(c)}px`;
                container.appendChild(bgCell);
            }
        }
    }

    function initGame() {
        board = Array.from({length: size}, () => Array(size).fill(0));
        score = 0;
        document.getElementById('score-val').innerText = '0';
        document.getElementById('game-result').style.display = 'none';
        drawTiles();
        addRandomTile();
        addRandomTile();
        drawTiles();
    }

    function addRandomTile() {
        let empty = [];
        for(let r=0; r<size; r++) {
            for(let c=0; c<size; c++) {
                if(board[r][c] === 0) empty.push({r, c});
            }
        }
        if(empty.length > 0) {
            let {r, c} = empty[Math.floor(Math.random()*empty.length)];
            board[r][c] = Math.random() < 0.9 ? 2 : 4;
        }
    }

    function drawTiles() {
        // Remove existing tiles
        const oldTiles = document.querySelectorAll('.tile');
        oldTiles.forEach(t => t.remove());

        for(let r=0; r<size; r++) {
            for(let c=0; c<size; c++) {
                if(board[r][c] !== 0) {
                    const tile = document.createElement('div');
                    tile.className = `tile tile-${board[r][c]}`;
                    tile.innerText = board[r][c];
                    // Same calculation as background cells
                    tile.style.top = `${getPos(r)}px`;
                    tile.style.left = `${getPos(c)}px`;
                    document.getElementById('grid-container').appendChild(tile);
                }
            }
        }
    }

    function compress(row) {
        let newRow = row.filter(v => v !== 0);
        for(let i=0; i<newRow.length-1; i++) {
            if(newRow[i] === newRow[i+1]) {
                newRow[i] *= 2;
                score += newRow[i];
                newRow.splice(i+1, 1);
            }
        }
        while(newRow.length < size) newRow.push(0);
        return newRow;
    }

    function move(dir) {
        let oldBoard = JSON.stringify(board);
        if(dir === 'left' || dir === 'right') {
            for(let r=0; r<size; r++) {
                let row = board[r];
                if(dir === 'right') row.reverse();
                let newRow = compress(row);
                if(dir === 'right') newRow.reverse();
                board[r] = newRow;
            }
        } else {
            for(let c=0; c<size; c++) {
                let col = [board[0][c], board[1][c], board[2][c], board[3][c]];
                if(dir === 'down') col.reverse();
                let newCol = compress(col);
                if(dir === 'down') newCol.reverse();
                for(let r=0; r<size; r++) board[r][c] = newCol[r];
            }
        }

        if(oldBoard !== JSON.stringify(board)) {
            addRandomTile();
            drawTiles();
            document.getElementById('score-val').innerText = score;
            checkStatus();
        }
    }

    function checkStatus() {
        if(board.flat().includes(2048)) showEnd("YOU WIN!");
        
        let canMove = false;
        for(let r=0; r<size; r++) {
            for(let c=0; c<size; c++) {
                if(board[r][c] === 0) canMove = true;
                if(r<3 && board[r][c] === board[r+1][c]) canMove = true;
                if(c<3 && board[r][c] === board[r][c+1]) canMove = true;
            }
        }
        if(!canMove) showEnd("GAME OVER");
    }

    function showEnd(msg) {
        document.getElementById('result-title').innerText = msg;
        document.getElementById('game-result').style.display = 'flex';
    }

    function resetGame() { initGame(); }

    window.addEventListener('keydown', e => {
        const key = e.key.toLowerCase();
        if(key === 'arrowup' || key === 'w') move('up');
        if(key === 'arrowdown' || key === 's') move('down');
        if(key === 'arrowleft' || key === 'a') move('left');
        if(key === 'arrowright' || key === 'd') move('right');
    });

    let tsX, tsY;
    window.addEventListener('touchstart', e => { tsX = e.touches[0].clientX; tsY = e.touches[0].clientY; });
    window.addEventListener('touchend', e => {
        let dx = e.changedTouches[0].clientX - tsX;
        let dy = e.changedTouches[0].clientY - tsY;
        if(Math.abs(dx) > Math.abs(dy)) {
            if(Math.abs(dx) > 30) move(dx > 0 ? 'right' : 'left');
        } else {
            if(Math.abs(dy) > 30) move(dy > 0 ? 'down' : 'up');
        }
    });

</script>
    <div class="visitor-stats" aria-label="Visitor statistics">
      <script type="text/javascript" id="clustrmaps" src="//clustrmaps.com/map_v2.js?d=GtDZVi4tsLCxCMPsshi4UGUmYEeEN1BC-yvrYvb1Rt4&cl=ffffff&w=250&h=150"></script>
    </div>

</body>
</html>
