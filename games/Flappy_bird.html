<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird - 1.0.0</title>
    <style>
        :root {
            --primary: #2ecc71;
            --primary-dark: #27ae60;
            --accent: #e67e22;
            --blue: #3498db;
            --blue-dark: #2980b9;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #1a1a2e;
            overflow: hidden;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        #game-container {
            position: relative;
            height: 90vh; 
            aspect-ratio: 9 / 16;
            border: 6px solid #fff;
            border-radius: 20px;
            box-shadow: 0 0 50px rgba(0,0,0,0.6);
            background: #70c5ce;
            overflow: hidden;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* 顶部状态栏 */
        #status-bar {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            color: white;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            z-index: 5;
            background: rgba(0,0,0,0.2);
            padding: 5px 12px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
            pointer-events: none;
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; 
            align-items: center;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            z-index: 10;
            text-align: center;
            transition: all 0.3s ease;
        }

        h1 { 
            font-size: 3.5rem; 
            margin: 0; 
            color: #fff;
            text-shadow: 0 4px #e67e22, 0 8px rgba(0,0,0,0.3);
            letter-spacing: -2px;
        }

        .tagline {
            font-size: 14px;
            opacity: 0.8;
            background: rgba(255,255,255,0.1);
            padding: 4px 12px;
            border-radius: 15px;
        }

        button {
            padding: 18px 50px;
            font-size: 1.8rem;
            font-weight: bold;
            background: var(--primary);
            border: none;
            border-bottom: 6px solid var(--primary-dark);
            color: white;
            cursor: pointer;
            border-radius: 15px;
            transition: transform 0.1s, background 0.2s;
            text-shadow: 0 2px rgba(0,0,0,0.2);
        }

        button:hover { background: #40e081; transform: scale(1.05); }
        button:active { transform: scale(0.95) translateY(4px); border-bottom-width: 2px; }

        .hidden { display: none !important; }

        #score-display {
            position: absolute;
            top: 50px;
            width: 100%;
            text-align: center;
            font-size: 80px;
            font-weight: 900;
            color: white;
            text-shadow: 0 6px rgba(0,0,0,0.2);
            z-index: 5;
            pointer-events: none;
        }

        /* 帮助弹窗样式 */
        #help-modal b { color: var(--primary-dark); }
        #help-modal ul li { margin-bottom: 10px; }
        #help-modal .close-btn:hover { color: #333 !important; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="status-bar" class="hidden">
        <span>SPD: <span id="speed-val">1.0</span></span>
        <span>INT: <span id="interval-val">500</span></span>
    </div>

    <div id="score-display" class="hidden">0</div>
    <canvas id="gameCanvas"></canvas>

    <div id="start-screen" class="overlay">
        <h1 style="margin-top: 80px;">Flappy Bird</h1>
        <div style="margin-top: auto; margin-bottom: 80px;">
            <button onclick="startGame()" style="display: block; margin: 0 auto;">START</button>
            <button onclick="toggleHelp(true)" style="padding: 10px 30px; font-size: 1.2rem; margin-top: 15px; background: var(--blue); border-bottom-color: var(--blue-dark);">HELP</button>
            <p class="tagline" style="margin-top: 20px; margin-bottom: 0;">Collaborated with Gemini 3 Pro</p>
        </div>
    </div>

    <div id="help-modal" class="overlay hidden" style="background: rgba(0,0,0,0.8); z-index: 20; justify-content: center;">
        <div style="position: relative; background: white; color: #333; padding: 30px; border-radius: 20px; width: 80%; max-width: 300px; text-align: left; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
            <div class="close-btn" onclick="toggleHelp(false)" style="position: absolute; top: 10px; right: 15px; font-size: 24px; cursor: pointer; font-weight: bold; color: #999;">&times;</div>
            <h2 style="margin-top: 0; color: var(--accent);">How to Play</h2>
            <ul style="padding-left: 20px; line-height: 1.6; font-size: 0.95rem;">
                <li>Press <b>Space</b> or <b>Click</b> to flap.</li>
                <li>Pass between green pipes.</li>
                <li>Speed up every <b>5 points</b>.</li>
                <li>Don't crash or fly away!</li>
            </ul>
            <button onclick="toggleHelp(false)" style="padding: 10px 0; width: 100%; font-size: 1rem; margin-top: 10px;">GOT IT!</button>
        </div>
    </div>

    <div id="end-screen" class="overlay hidden">
        <h1 style="margin-top: 80px; color: #ff4757; text-shadow: 0 4px #c0392b;">Ouch!</h1>
        <div style="margin: auto 0;">
            <p style="margin:0; font-size: 1.2rem; opacity: 0.8; letter-spacing: 2px;">YOUR SCORE</p>
            <h2 id="final-score" style="font-size: 5rem; margin:0; line-height: 1;">0</h2>
        </div>
        <div style="margin-bottom: 80px;">
            <button onclick="startGame()">REPLAY</button>
            <p style="margin-top: 20px; font-size: 14px; opacity: 0.5;">Persistence is the key to success!</p>
        </div>
    </div>

    <div style="position: absolute; bottom: 10px; right: 15px; font-size: 11px; color: rgba(255,255,255,0.4); pointer-events: none; z-index: 11; font-family: monospace;">
        v1.0.0, 260214
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const startScreen = document.getElementById('start-screen');
    const endScreen = document.getElementById('end-screen');
    const helpModal = document.getElementById('help-modal');
    const scoreDisplay = document.getElementById('score-display');
    const finalScoreTxt = document.getElementById('final-score');
    const statusBar = document.getElementById('status-bar');
    const speedValTxt = document.getElementById('speed-val');
    const intervalValTxt = document.getElementById('interval-val');

    canvas.width = 360; canvas.height = 640;

    let state = "READY"; 
    let frames = 0, score = 0;
    let currentDx = 1.0, currentInterval = 500;

    function toggleHelp(show) {
        if (show) helpModal.classList.remove('hidden');
        else helpModal.classList.add('hidden');
    }

    const bird = {
        x: 80, y: 300, w: 38, h: 28,
        gravity: 0.05, jump: 3, maxFallSpeed: 8,
        speed: 0, rotation: 0,
        draw: function() {
            ctx.save();
            ctx.translate(this.x, this.y); ctx.rotate(this.rotation);
            let grad = ctx.createLinearGradient(-this.w/2, 0, this.w/2, 0);
            grad.addColorStop(0, "#f1c40f"); grad.addColorStop(1, "#f39c12");
            ctx.fillStyle = grad;
            ctx.beginPath(); ctx.ellipse(0, 0, this.w/2, this.h/2, 0, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = "#333"; ctx.lineWidth = 2; ctx.stroke();
            ctx.fillStyle = "white"; ctx.beginPath(); ctx.arc(10, -5, 6, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            ctx.fillStyle = "black"; ctx.beginPath(); ctx.arc(12, -5, 2.5, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.ellipse(-10, 2, 8, 5, -this.rotation, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            ctx.fillStyle = "#e67e22"; ctx.beginPath(); ctx.moveTo(14, 0); ctx.lineTo(24, 4); ctx.lineTo(14, 8); ctx.closePath(); ctx.fill(); ctx.stroke();
            ctx.restore();
        },
        update: function() {
            if (state !== "PLAYING") return;
            this.speed += this.gravity;
            if(this.speed > this.maxFallSpeed) this.speed = this.maxFallSpeed;
            this.y += this.speed;
            this.rotation = Math.min(Math.PI/4, Math.max(-Math.PI/8, (this.speed / 10)));
            if (this.y + this.h/2 >= canvas.height - 25 || this.y < 0) gameOver();
        },
        flap: function() { this.speed = -this.jump; }
    };

    const pipes = {
        position: [], w: 65, gap: 165,
        draw: function() {
            for(let p of this.position) {
                let grad = ctx.createLinearGradient(p.x, 0, p.x + this.w, 0);
                grad.addColorStop(0, '#2ecc71'); grad.addColorStop(0.5, '#55efc4'); grad.addColorStop(1, '#27ae60');
                ctx.fillStyle = grad; ctx.strokeStyle = "#2c3e50"; ctx.lineWidth = 3;
                ctx.fillRect(p.x, 0, this.w, p.y); ctx.strokeRect(p.x, -5, this.w, p.y + 5);
                ctx.fillRect(p.x - 5, p.y - 20, this.w + 10, 20); ctx.strokeRect(p.x - 5, p.y - 20, this.w + 10, 20);
                let bottomY = p.y + this.gap;
                ctx.fillRect(p.x, bottomY, this.w, canvas.height - bottomY); ctx.strokeRect(p.x, bottomY, this.w, canvas.height - bottomY + 5);
                ctx.fillRect(p.x - 5, bottomY, this.w + 10, 20); ctx.strokeRect(p.x - 5, bottomY, this.w + 10, 20);
            }
        },
        update: function() {
            if (state !== "PLAYING") return;
            if (frames % currentInterval === 0) {
                let randomY = Math.floor(Math.random() * (canvas.height - this.gap - 180)) + 80;
                this.position.push({ x: canvas.width, y: randomY, scored: false });
            }
            for(let i = this.position.length - 1; i >= 0; i--) {
                let p = this.position[i];
                p.x -= currentDx;
                if (bird.x + bird.w/2 - 5 > p.x && bird.x - bird.w/2 + 5 < p.x + this.w) {
                    if (bird.y - bird.h/2 + 5 < p.y || bird.y + bird.h/2 - 5 > p.y + this.gap) gameOver();
                }
                if (p.x + this.w < bird.x && !p.scored) {
                    score++; p.scored = true; scoreDisplay.innerText = score;
                    if (score > 0 && score % 5 === 0) {
                        if (currentDx < 1.5) currentDx = parseFloat((currentDx + 0.1).toFixed(1));
                        if (currentInterval > 300) currentInterval -= 40;
                        updateStatusUI();
                    }
                }
                if (p.x + this.w < -20) this.position.splice(i, 1);
            }
        }
    };

    function updateStatusUI() {
        speedValTxt.innerText = currentDx.toFixed(1);
        intervalValTxt.innerText = currentInterval;
    }

    function loop() {
        ctx.fillStyle = "#70c5ce"; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#e1da95"; ctx.fillRect(0, canvas.height - 25, canvas.width, 25);
        ctx.fillStyle = "#88e171"; ctx.fillRect(0, canvas.height - 30, canvas.width, 5);
        pipes.draw(); pipes.update(); bird.draw(); bird.update();
        if (state === "PLAYING") frames++;
        requestAnimationFrame(loop);
    }

    function startGame() {
        state = "PLAYING"; score = 0; frames = 0; currentDx = 1.0; currentInterval = 500;
        bird.y = 300; bird.speed = 0; pipes.position = []; toggleHelp(false);
        updateStatusUI(); scoreDisplay.innerText = "0";
        scoreDisplay.classList.remove('hidden'); statusBar.classList.remove('hidden');
        startScreen.classList.add('hidden'); endScreen.classList.add('hidden');
    }

    function gameOver() {
        state = "OVER"; finalScoreTxt.innerText = score;
        scoreDisplay.classList.add('hidden'); statusBar.classList.add('hidden');
        endScreen.classList.remove('hidden');
    }

    window.addEventListener('keydown', (e) => { if(e.code === 'Space') bird.flap(); });
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); bird.flap(); }, {passive: false});
    canvas.addEventListener('mousedown', (e) => { if(state === "PLAYING") bird.flap(); });

    loop();
</script>
    <div class="visitor-stats" aria-label="Visitor statistics">

    </div>

</body>
</html>
