<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Egg Master - 进击的40个蛋</title>
    <style>
        :root {
            --primary: #f39c12;
            --dark: #2c3e50;
            --fire: #e67e22;
            --bg: #ecf0f1;
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: 'PingFang SC', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--dark);
            overflow: hidden;
        }

        /* 语言切换按钮 */
        #lang-toggle {
            position: fixed; top: 20px; right: 20px; z-index: 4000;
            background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.5);
            color: white; padding: 5px 15px; border-radius: 20px; cursor: pointer;
            backdrop-filter: blur(5px); font-size: 0.9rem;
        }
        #lang-toggle:hover { background: rgba(255,255,255,0.3); }

        /* 开始界面 */
        #menu-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #1a2a3a 0%, #000000 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 1000; color: white; text-align: center;
        }

        h1.title { font-size: 4.5rem; margin: 0; letter-spacing: 8px; color: var(--primary); text-shadow: 0 0 30px rgba(243,156,18,0.6); }
        .tagline { font-size: 1rem; color: #95a5a6; font-weight: 300; letter-spacing: 1px; }

        .btn-group { margin-top: 50px; display: flex; flex-direction: column; gap: 15px; }
        
        .main-btn {
            padding: 15px 50px; font-size: 1.1rem; border: none; border-radius: 30px;
            cursor: pointer; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-weight: bold; width: 260px;
        }

        .btn-start { background: var(--primary); color: white; box-shadow: 0 4px 15px rgba(243,156,18,0.4); }
        .btn-start:hover { transform: scale(1.05); background: #f1c40f; }

        .btn-info { background: transparent; color: white; border: 2px solid rgba(255,255,255,0.5); }
        .btn-info:hover { background: rgba(255,255,255,0.1); border-color: white; }

        .version { position: fixed; bottom: 20px; right: 20px; font-size: 0.8rem; color: #7f8c8d; font-family: monospace; }

        /* 玩法介绍弹窗 */
        #modal {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 85%; max-width: 550px; background: white; color: #333; padding: 35px;
            border-radius: 20px; box-shadow: 0 25px 70px rgba(0,0,0,0.6); z-index: 2000;
            line-height: 1.6;
        }
        #modal h3 { margin-top: 0; color: var(--dark); border-left: 5px solid var(--primary); padding-left: 15px; }
        .close-btn { position: absolute; top: 20px; right: 25px; font-size: 2rem; cursor: pointer; color: #ccc; }
        .origin-story { background: #f9f9f9; padding: 15px; border-radius: 10px; font-size: 0.9rem; color: #666; margin-bottom: 20px; }

        /* 游戏主体界面 */
        #game-container { padding: 20px; display: flex; flex-direction: column; align-items: center; opacity: 0; transition: opacity 0.8s; }
        #stats-bar { display: flex; gap: 40px; font-size: 1.2rem; background: white; padding: 15px 40px; border-radius: 50px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); margin-bottom: 25px; font-weight: bold; }
        #game-lang-btn { color: var(--dark); border-color: var(--dark); }

        #grid { 
            display: grid; grid-template-columns: repeat(8, 1fr); gap: 12px;
            max-width: 95vw;
        }

        .pot {
            width: 90px; height: 115px; background: #fff; border: 2px solid #eee; border-radius: 15px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; position: relative; transition: all 0.2s;
        }

        .pot.cooking { border-color: var(--fire); background: #fffcf0; box-shadow: 0 10px 20px rgba(230,126,34,0.15); }
        .pot.cooking .egg-icon { animation: flame-burn 0.5s infinite alternate; }
        @keyframes flame-burn { from { transform: scale(1); } to { transform: scale(1.1); filter: drop-shadow(0 0 5px orange); } }
        
        .pot.perfect { background: var(--primary); color: white; border-color: #d35400; }
        .pot.failed { background: #34495e; color: white; }

        .egg-icon { font-size: 2.2rem; margin-bottom: 5px; }
        .pot-timer { font-size: 0.8rem; font-family: monospace; font-weight: bold; }

        /* 结束界面 */
        #game-over {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 3000; color: white;
            flex-direction: column; align-items: center; justify-content: center;
        }
    </style>
</head>
<body>

    <button id="lang-toggle" onclick="toggleLanguage()">English / 中文</button>

    <div id="menu-overlay">
        <h1 class="title">EGG MASTER</h1>
        <p class="tagline" data-i18n="tagline">Collaborated with Gemini 3 Pro</p>
        
        <div class="btn-group">
            <button class="main-btn btn-start" onclick="enterGame()" data-i18n="start">开始挑战</button>
            <button class="main-btn btn-info" onclick="toggleModal(true)" data-i18n="howTo">玩法介绍</button>
        </div>

        <div class="version">v1.0.0, 260214</div>
    </div>

    <div id="modal">
        <span class="close-btn" onclick="toggleModal(false)">&times;</span>
        <h3 data-i18n="aboutTitle">关于“蛋神”</h3>
        <div class="origin-story" data-i18n="originText">
            这个游戏的灵感源自 2025 年底爆红的抖音博主“爱吃蛋”。他研究出了精准到秒的煮蛋秘籍：“水开下蛋，煮 9 分 12 秒，立马过凉水”。这种把平凡小事做到极致的精神，成就了互联网上的“蛋神”传说。
        </div>
        
        <h3 data-i18n="ruleTitle">游戏规则</h3>
        <p data-i18n="ruleText">
            • 点击空闲的锅开始。在 <b>9.2s</b> (模拟 9'12") 瞬间捞出。<br>
            • 误差超过 0.5s 或超时未捞，废蛋一颗。你有 3 次机会。
        </p>
    </div>

    <div id="game-container">
        <div id="stats-bar">
            <span data-i18n="scoreLabel">SCORE</span>: <span id="score" style="color:var(--primary)">0</span>
            <span data-i18n="livesLabel">LIVES</span>: <span id="lives" style="color:#e74c3c">♥♥♥</span>
        </div>
        <div id="grid"></div>
    </div>

    <div id="game-over">
        <h1 id="gameOverTitle" style="color:var(--primary); font-size: 4rem; margin-bottom: 10px;" data-i18n="gameOver">生涯结束</h1>
        <p id="final-stats" style="font-size: 1.8rem; margin: 10px 0;"></p>
        <p id="final-eval" style="font-style: italic; color: #bdc3c7; font-size: 1.2rem;"></p>
        <button class="main-btn btn-start" style="margin-top: 40px;" onclick="location.reload()" data-i18n="restart">重新修炼</button>
    </div>

<script>
    const i18n = {
        zh: {
            tagline: "Collaborated with Gemini 3 Pro",
            start: "开始挑战",
            howTo: "玩法介绍",
            aboutTitle: "关于“蛋神”",
            originText: "这个游戏的灵感源自 2025 年底爆红的抖音博主“爱吃蛋”（冯昌绪）。他研究出了精准到秒的煮蛋秘籍：“水开下蛋，煮 9 分 12 秒，立马过凉水”。这种把平凡小事做到极致的精神，成就了互联网上的“蛋神”传说。",
            ruleTitle: "游戏规则",
            ruleText: "• 在 9.2s (模拟 9'12\") 瞬间捞出。<br>• 误差超过 0.5s 或超时未捞，废蛋一颗。你有 3 次机会。",
            scoreLabel: "得分",
            livesLabel: "生命",
            ready: "待命",
            gameOver: "挑战结束",
            restart: "重新修炼",
            eval_god: "评价：当代蛋神，9分12秒已刻入DNA！",
            eval_good: "评价：火候大师，这蛋剥开绝对流心。",
            eval_bad: "评价：你这煮的是石头吗？凉水没过位啊！"
        },
        en: {
            tagline: "Collaborated with Gemini 3 Pro",
            start: "START CHALLENGE",
            howTo: "HOW TO PLAY",
            aboutTitle: "About EGG MASTER",
            originText: "Inspired by the viral tiktoker 'Egg Lover'. He spent 5 years mastering the perfect egg: boil for exactly 9m12s, then cool immediately. This game celebrates the spirit of mastering a simple craft.",
            ruleTitle: "RULES",
            ruleText: "• Harvest at <b>9.2s</b> (simulating 9'12\").<br>• Error >0.5s or over-boiling results in a 'Dead Egg'. 3 strikes and you're out!",
            scoreLabel: "SCORE",
            livesLabel: "LIVES",
            ready: "READY",
            gameOver: "GAME OVER",
            restart: "RETRY",
            eval_god: "Rank: LEGEND. 9'12\" is in your DNA!",
            eval_good: "Rank: PRO. Perfect soft-boiled texture.",
            eval_bad: "Rank: NOVICE. This egg is a rock! Check the cooling water!"
        }
    };

    let currentLang = 'zh';
    const GRID_SIZE = 40;
    const TARGET = 9.2;
    let score = 0, lives = 3, gameActive = false;
    let pots = [];
    let gameLoopTimeout = null;

    function toggleLanguage() {
        currentLang = currentLang === 'zh' ? 'en' : 'zh';
        updatePageText();
    }

    function updatePageText() {
        // 更新所有带有 data-i18n 属性的静态文本
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            el.innerHTML = i18n[currentLang][key];
        });
        
        // 更新实时状态（锅的状态文字）
        pots.forEach((p, i) => {
            if (p.status === 'idle') {
                const el = document.getElementsByClassName('pot')[i];
                if(el) el.querySelector('.pot-timer').innerText = i18n[currentLang].ready;
            }
        });
        
        // 更新语言按钮背景色提示当前选择
        document.getElementById('lang-toggle').style.color = currentLang === 'en' ? '#f39c12' : '#fff';
    }

    function toggleModal(show) {
        document.getElementById('modal').style.display = show ? 'block' : 'none';
    }

    function enterGame() {
        const overlay = document.getElementById('menu-overlay');
        overlay.style.opacity = '0';
        // 游戏界面文字颜色切换
        document.getElementById('lang-toggle').style.color = '#2c3e50';
        document.getElementById('lang-toggle').style.borderColor = '#2c3e50';

        setTimeout(() => {
            overlay.style.display = 'none';
            document.getElementById('game-container').style.opacity = '1';
            initGrid();
            gameActive = true;
            startGameLoop();
        }, 600);
    }

    function initGrid() {
        const grid = document.getElementById('grid');
        grid.innerHTML = '';
        for (let i = 0; i < GRID_SIZE; i++) {
            const div = document.createElement('div');
            div.className = 'pot';
            div.innerHTML = `<span class="egg-icon">🥚</span><div class="pot-timer">${i18n[currentLang].ready}</div>`;
            div.onclick = () => handlePotClick(i);
            grid.appendChild(div);
            pots[i] = { status: 'idle', timer: null, start: 0 };
        }
    }

    function handlePotClick(i) {
        if (!gameActive) return;
        if (pots[i].status === 'idle') startCooking(i);
        else if (pots[i].status === 'cooking') harvest(i);
    }

    function startCooking(i) {
        const el = document.getElementsByClassName('pot')[i];
        pots[i].status = 'cooking';
        pots[i].start = Date.now();
        el.classList.add('cooking');
        el.querySelector('.egg-icon').innerText = '🔥';
        
        pots[i].timer = setInterval(() => {
            let diff = (Date.now() - pots[i].start) / 1000;
            el.querySelector('.pot-timer').innerText = diff.toFixed(1) + 's';
            if (diff > 12) harvest(i); 
        }, 100);
    }

    function harvest(i) {
        if (pots[i].status !== 'cooking') return;
        clearInterval(pots[i].timer);
        const el = document.getElementsByClassName('pot')[i];
        let diff = (Date.now() - pots[i].start) / 1000;
        let error = Math.abs(diff - TARGET);
        
        if (error <= 0.2) {
            pots[i].status = 'perfect';
            el.className = 'pot perfect';
            el.querySelector('.egg-icon').innerText = '✨';
            score += 100;
        } else if (error <= 0.5) {
            pots[i].status = 'ok';
            el.className = 'pot';
            el.style.background = "#ffeaa7";
            el.querySelector('.egg-icon').innerText = '✅';
            score += 30;
        } else {
            pots[i].status = 'failed';
            el.className = 'pot failed';
            el.querySelector('.egg-icon').innerText = '🌑';
            lives--;
            updateHUD();
            if (lives <= 0) endGame();
        }
        
        document.getElementById('score').innerText = score;
        if (lives > 0) setTimeout(() => resetPot(i), 2000);
    }

    function resetPot(i) {
        if (!gameActive) return;
        const el = document.getElementsByClassName('pot')[i];
        el.className = 'pot';
        el.style.background = "";
        el.querySelector('.egg-icon').innerText = '🥚';
        el.querySelector('.pot-timer').innerText = i18n[currentLang].ready;
        pots[i].status = 'idle';
    }

    function updateHUD() {
        document.getElementById('lives').innerText = "♥".repeat(Math.max(0, lives));
    }

    function startGameLoop() {
        if (!gameActive) return;
        let cookingNow = pots.filter(p => p.status === 'cooking').length;
        let targetCooking = 2 + Math.floor(score / 800); 
        if (cookingNow < targetCooking) {
            let idles = pots.map((p,idx) => p.status === 'idle' ? idx : null).filter(v => v !== null);
            if (idles.length > 0) startCooking(idles[Math.floor(Math.random()*idles.length)]);
        }
        gameLoopTimeout = setTimeout(startGameLoop, Math.max(500, 2000 - score/5));
    }

    function endGame() {
        gameActive = false;
        clearTimeout(gameLoopTimeout);
        document.getElementById('game-over').style.display = 'flex';
        document.getElementById('final-stats').innerText = `${i18n[currentLang].scoreLabel}: ${score}`;
        
        let evalKey = score >= 2000 ? "eval_god" : (score >= 800 ? "eval_good" : "eval_bad");
        document.getElementById('final-eval').innerText = i18n[currentLang][evalKey];
    }
</script>
    <div class="visitor-stats" aria-label="Visitor statistics">
      <div class="visitor-map" data-visitor-map></div>
    </div>
  <script src="../site.js?v=20260605b"></script>
</body>
</html>
