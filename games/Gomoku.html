<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gobang AI - v1.0.0</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #e67e22;
            --bg-color: #f4f7f6;
            --board-color: #e6b37d;
            --tagline-color: #7f8c8d;
        }

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: var(--bg-color);
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        .game-container {
            position: relative;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            text-align: center;
        }

        h1 {
            margin: 0;
            color: var(--primary-color);
            font-size: 36px;
            letter-spacing: 4px;
        }

        .tagline {
            color: var(--tagline-color);
            font-size: 14px;
            font-style: italic;
            letter-spacing: 1px;
        }

        #board-wrapper {
            position: relative;
            display: inline-block;
            margin-top: 20px;
        }

        canvas {
            background-color: var(--board-color);
            border-radius: 4px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.2);
            cursor: pointer;
        }

        .controls {
            margin-top: 25px;
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        button {
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .btn-player { background-color: #333; color: white; }
        .btn-ai { background-color: #7f8c8d; color: white; }
        .btn-help { background-color: #3498db; color: white; }
        button:hover { opacity: 0.9; transform: translateY(-1px); }

        #resultOverlay {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            border-radius: 4px;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 10;
        }

        #resultText { font-size: 32px; margin-bottom: 20px; font-weight: bold; }
        .btn-restart { background-color: var(--accent-color); color: white; font-size: 18px; }

        .version {
            position: absolute;
            bottom: 10px;
            right: 15px;
            font-size: 12px;
            color: #bdc3c7;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            max-width: 400px;
            text-align: left;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="game-container">
    <h1>GOMOKU (五子棋)</h1>
    <p class="tagline" style="margin-top: 20px; margin-bottom: 0;">Collaborated with Gemini 3 Pro</p>

    <div id="board-wrapper">
        <canvas id="chess" width="450" height="450"></canvas>
        <div id="resultOverlay">
            <div id="resultText">AI WINS!</div>
            <button class="btn-restart" onclick="resetGame()">RESTART</button>
        </div>
    </div>

    <div class="controls">
        <button class="btn-player" onclick="startGame(true)">Player First (Black)</button>
        <button class="btn-ai" onclick="startGame(false)">AI First (Black)</button>
        <button class="btn-help" onclick="toggleHelp(true)">Rules</button>
    </div>

    <div class="version">v1.0.0, 260214</div>
</div>

<div id="helpModal" class="modal">
    <div class="modal-content">
        <h3 style="margin-top:0">Game Rules</h3>
        <p>1. The side that goes first uses <b>Black</b> pieces.</p>
        <p>2. Players take turns placing a piece on an empty intersection.</p>
        <p>3. <b>Winning:</b> Be the first to get 5 pieces in a row (horizontally, vertically, or diagonally).</p>
        <button class="btn-help" style="width:100%" onclick="toggleHelp(false)">GOT IT</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('chess');
    const context = canvas.getContext('2d');
    const size = 15;
    const padding = 15;
    const step = 30;

    let chessBoard = [];
    let over = false;
    let isPlayerTurn = false;
    let playerIsBlack = true;

    function initData() {
        over = false;
        chessBoard = Array.from({length: size}, () => Array(size).fill(0));
        document.getElementById('resultOverlay').style.display = 'none';
        drawBoard();
    }

    function drawBoard() {
        context.clearRect(0, 0, canvas.width, canvas.height);
        context.strokeStyle = "#5d4037";
        context.lineWidth = 1;
        for (let i = 0; i < size; i++) {
            context.beginPath();
            context.moveTo(padding + i * step, padding);
            context.lineTo(padding + i * step, canvas.height - padding);
            context.stroke();
            context.moveTo(padding, padding + i * step);
            context.lineTo(canvas.width - padding, padding + i * step);
            context.stroke();
        }
    }

    function drawPiece(i, j, isBlack) {
        context.beginPath();
        context.arc(padding + i * step, padding + j * step, 13, 0, 2 * Math.PI);
        let grad = context.createRadialGradient(
            padding + i * step + 2, padding + j * step - 2, 13, 
            padding + i * step + 2, padding + j * step - 2, 0
        );
        if (isBlack) {
            grad.addColorStop(0, "#000");
            grad.addColorStop(1, "#666");
        } else {
            grad.addColorStop(0, "#d1d1d1");
            grad.addColorStop(1, "#fff");
        }
        context.fillStyle = grad;
        context.fill();
    }

    function startGame(playerFirst) {
        initData();
        if (playerFirst) {
            playerIsBlack = true;
            isPlayerTurn = true;
        } else {
            playerIsBlack = false;
            isPlayerTurn = false;
            setTimeout(() => {
                let center = 7;
                drawPiece(center, center, true);
                chessBoard[center][center] = 2;
                isPlayerTurn = true;
            }, 500);
        }
    }

    function resetGame() {
        initData();
    }

    canvas.onclick = function(e) {
        if (over || !isPlayerTurn) return;
        let i = Math.floor(e.offsetX / step);
        let j = Math.floor(e.offsetY / step);

        if (i >= 0 && i < size && j >= 0 && j < size && chessBoard[i][j] === 0) {
            drawPiece(i, j, playerIsBlack);
            chessBoard[i][j] = 1;

            if (checkWin(i, j, 1)) {
                showResult("YOU WIN!");
            } else {
                isPlayerTurn = false;
                setTimeout(aiMove, 400);
            }
        }
    };

    function aiMove() {
        if (over) return;
        let best = { x: 7, y: 7, score: -1 };

        for (let i = 0; i < size; i++) {
            for (let j = 0; j < size; j++) {
                if (chessBoard[i][j] === 0) {
                    let score = evaluate(i, j, 2) * 1.2 + evaluate(i, j, 1);
                    if (score > best.score) {
                        best = { x: i, y: j, score: score };
                    }
                }
            }
        }

        drawPiece(best.x, best.y, !playerIsBlack);
        chessBoard[best.x][best.y] = 2;

        if (checkWin(best.x, best.y, 2)) {
            showResult("AI WINS!");
        } else {
            isPlayerTurn = true;
        }
    }

    function evaluate(x, y, role) {
        let total = 0;
        const dirs = [[1,0],[0,1],[1,1],[1,-1]];
        dirs.forEach(d => {
            let count = 0;
            for(let k=1; k<5; k++) {
                let nx = x + d[0]*k, ny = y + d[1]*k;
                if(nx>=0 && nx<size && ny>=0 && ny<size && chessBoard[nx][ny] === role) count++;
                else break;
            }
            for(let k=1; k<5; k++) {
                let nx = x - d[0]*k, ny = y - d[1]*k;
                if(nx>=0 && nx<size && ny>=0 && ny<size && chessBoard[nx][ny] === role) count++;
                else break;
            }
            total += Math.pow(10, count);
        });
        return total;
    }

    function checkWin(x, y, role) {
        const dirs = [[1,0],[0,1],[1,1],[1,-1]];
        return dirs.some(d => {
            let count = 1;
            for(let k=1; k<5; k++) {
                let nx=x+d[0]*k, ny=y+d[1]*k;
                if(nx>=0 && nx<size && ny>=0 && ny<size && chessBoard[nx][ny]===role) count++;
                else break;
            }
            for(let k=1; k<5; k++) {
                let nx=x-d[0]*k, ny=y-d[1]*k;
                if(nx>=0 && nx<size && ny>=0 && ny<size && chessBoard[nx][ny]===role) count++;
                else break;
            }
            return count >= 5;
        });
    }

    function showResult(text) {
        over = true;
        const overlay = document.getElementById('resultOverlay');
        const textDiv = document.getElementById('resultText');
        textDiv.innerText = text;
        overlay.style.display = 'flex';
    }

    function toggleHelp(show) {
        document.getElementById('helpModal').style.display = show ? 'flex' : 'none';
    }

    initData();
</script>

    </div>

</body>
</html>
