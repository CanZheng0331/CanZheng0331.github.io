  <meta name="color-scheme" content="light dark">

  <style>
    html.note-view-root,
    html.note-view-root body.note-view { overflow: hidden; }
    body.note-view main.container { height: calc(100vh - 64px); padding-bottom: 18px; }
    body.note-view article.card { display: flex; flex-direction: column; height: calc(100vh - 96px); margin-bottom: 0; overflow: hidden; padding: 22px 28px; transform: none; }
    .note-reader-head { flex: 0 0 auto; padding-right: 84px; border-bottom: 1px solid var(--border); margin-bottom: 16px; position: relative; }
    .note-reader-head h1 { margin-top: 0; margin-bottom: 12px; }
    .note-meta { margin-bottom: 16px; }
    .note-layout { display: grid; grid-template-columns: minmax(180px, 260px) minmax(0, 1fr); gap: 28px; align-items: stretch; flex: 1 1 auto; min-height: 0; }
    .note-toc { min-height: 0; overflow: auto; border-right: 1px solid var(--border); padding: 4px 16px 8px 0; font-size: 0.9rem; text-align: left !important; scrollbar-gutter: stable; }
    .note-toc * { text-align: left !important; }
    .note-toc[hidden] { display: none; }
    .note-toc-title { color: var(--muted); display: block; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.08em; margin: 0 0 10px; text-transform: uppercase; }
    .note-toc nav { align-items: stretch; display: flex; flex-direction: column; gap: 2px; justify-content: flex-start; width: 100%; }
    .note-toc a { border-left: 3px solid transparent; color: var(--muted); display: block; line-height: 1.35; padding: 6px 0 6px 10px; text-align: left; text-decoration: none; }
    .note-toc a:hover, .note-toc a.active { color: var(--accent); border-left-color: var(--accent); }
    .note-toc .toc-level-1 { font-weight: 700; color: var(--fg); }
    .note-toc .toc-level-3 { padding-left: 24px; font-size: 0.86rem; }
    .note-toc .toc-level-4 { padding-left: 38px; font-size: 0.82rem; }
    #note-content { min-width: 0; min-height: 0; overflow: auto; padding-right: 8px; scrollbar-gutter: stable; }
    .note-toc[hidden] + #note-content { grid-column: 1 / -1; }
    #note-content h1, #note-content h2, #note-content h3, #note-content h4 { scroll-margin-top: 18px; }
    .note-tag { background: color-mix(in srgb, var(--accent) 12%, transparent); border-radius: 6px; color: var(--accent); display: inline-block; font-size: 0.78rem; font-weight: 700; margin: 0 6px 0 0; padding: 2px 6px; white-space: nowrap; }
    .back-link { position: absolute; right: 0; top: 0; z-index: 20; display: inline-flex; align-items: center; gap: 6px; width: fit-content; padding: 8px 12px; border-radius: 8px; background: color-mix(in srgb, var(--card) 94%, transparent); border: 1px solid var(--border); box-shadow: var(--shadow-sm); font-weight: 500; text-decoration: none; }
    .back-link:hover { text-decoration: none; border-color: var(--accent); }
    body.pdf-mode { overflow: hidden; }
    body.pdf-mode main.container { height: 100vh; padding-bottom: 24px; display: flex; flex-direction: column; }
    body.pdf-mode article.card { flex: 1; display: flex; flex-direction: column; margin-bottom: 0; overflow: hidden; }
    body.pdf-mode .note-layout { display: block; flex: 1 1 auto; min-height: 0; overflow: hidden; }
    body.pdf-mode .note-toc { display: none; }
    body.pdf-mode #note-content { height: calc(100vh - 250px); min-height: 520px; overflow: hidden; margin-top: 16px; }
    body.pdf-mode .pdf-container { display: block; width: 100%; height: 100%; border: 1px solid var(--border); border-radius: 8px; }
    @media (max-width: 900px) {
      .note-layout { display: block; }
      html.note-view-root,
      html.note-view-root body.note-view { overflow: auto; }
      body.note-view main.container { height: auto; }
      body.note-view article.card { height: auto; min-height: calc(100vh - 96px); overflow: visible; }
      .note-reader-head { padding-right: 0; position: sticky; top: 64px; z-index: 20; background: var(--card); }
      .note-toc { max-height: 180px; border-right: 0; border-bottom: 1px solid var(--border); margin-bottom: 20px; padding: 0 0 14px; }
      #note-content { overflow: visible; padding-right: 0; }
      .back-link { right: 0; top: 0; }
      body.pdf-mode #note-content { height: calc(100vh - 230px); min-height: 420px; }
    }
  </style>

  <main class="container">
    <article class="prose card">
      <div class="note-reader-head">
        <h1 id="note-title">Loading...</h1>
        <div class="note-meta" id="note-tags"></div>
        <a class="back-link" href="./"><i class="fas fa-arrow-left"></i> Back</a>

  <footer class="footer">

    <script src="../../site.js?v=20260614-worker-stats"></script>
  </footer>

  <script>
    const notes = {
      "multiple-antenna-communications": {
        title: "Multiple Antenna Communications",
        file: "multi_antenna/notes_on_multi_antennas.pdf",
        tags: ["Advanced", "Wireless Communications", "Signal Processing", "English", "Course", "Online Course", "Lecture"]
      },
      "estimation-and-detection-theory": {
        title: "Estimation and Detection Theory",
        file: "estimation_detection/notes_on_estimation_and_detection_v1_0.pdf",
        tags: ["Grad", "Signal Processing", "English", "Course", "Online Course"]
      },
      "trustworthy-gai": {
        title: "Trustworthy Generative AI",
        file: "Coursera_Trustworthy_GAI/note.md",
        tags: ["Advanced", "AI", "Chinese", "Online Course"]
      }
    };

    const noteTitle = document.getElementById("note-title");
    const noteTags = document.getElementById("note-tags");
    const noteContent = document.getElementById("note-content");
    const noteToc = document.getElementById("note-toc");
    const noteTocList = document.getElementById("note-toc-list");
    let tocObserver = null;
    let tocScrollHandler = null;

    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[char]));
    }

    function extractMath(markdown) {
      const chunks = [];
      const masked = markdown.replace(/(\$\$[\s\S]*?\$\$|\\\[[\s\S]*?\\\]|\\\([\s\S]*?\\\)|(?<!\\)\$(?!\s)(?:\\.|[^\n$\\])+(?<!\s)(?<!\\)\$)/g, (match) => {
        const token = `@@MATH_${chunks.length}@@`;
        chunks.push(match);
        return token;
      });
      return { masked, chunks };
    }

    function restoreMath(html, chunks) {
      return html.replace(/@@MATH_(\d+)@@/g, (_, index) => chunks[Number(index)] || "");
    }

    function slugifyHeading(text, fallback) {
      const slug = text.trim().toLowerCase().normalize("NFKD")
        .replace(/[^\p{L}\p{N}\s-]/gu, "")
        .replace(/\s+/g, "-")
        .replace(/-+/g, "-")
        .replace(/^-|-$/g, "")
        .slice(0, 80);
      return slug || fallback;
    }

    function buildToc() {
      if (tocObserver) tocObserver.disconnect();
      if (tocScrollHandler) {
        noteContent.removeEventListener("scroll", tocScrollHandler);
        tocScrollHandler = null;
      }
      noteTocList.innerHTML = "";
      const headings = Array.from(noteContent.querySelectorAll("h1, h2, h3, h4")).filter((heading) => {
        return heading.textContent.trim() && heading.getClientRects().length > 0;
      });
      if (headings.length < 2) {
        noteToc.hidden = true;
        return;
      }
      const usedIds = new Set();
      headings.forEach((heading, index) => {
        const baseId = heading.id || slugifyHeading(heading.textContent, `section-${index + 1}`);
        let uniqueId = baseId;
        let suffix = 2;
        while (usedIds.has(uniqueId)) {
          uniqueId = `${baseId}-${suffix}`;
          suffix += 1;
        }
        heading.id = uniqueId;
        usedIds.add(uniqueId);
        const level = Number(heading.tagName.slice(1));
        const link = document.createElement("a");
        link.href = `#${encodeURIComponent(uniqueId)}`;
        link.className = `toc-level-${level}`;
        link.dataset.target = uniqueId;
        link.textContent = heading.textContent.trim();
        link.addEventListener("click", (event) => {
          event.preventDefault();
          noteContent.scrollTo({
            top: Math.max(0, heading.offsetTop - noteContent.offsetTop - 12),
            behavior: "smooth"
          });
          history.replaceState(null, "", `#${encodeURIComponent(uniqueId)}`);
        });
        noteTocList.appendChild(link);
      });
      noteToc.hidden = false;
      const links = Array.from(noteTocList.querySelectorAll("a"));
      const setActiveLink = (headingId) => {
        let activeLink = null;
        links.forEach((link) => {
          const active = link.dataset.target === headingId;
          link.classList.toggle("active", active);
          if (active) activeLink = link;
        });
        if (activeLink) {
          activeLink.scrollIntoView({ block: "nearest", inline: "nearest" });
        }
      };
      const updateActiveFromScroll = () => {
        const currentTop = noteContent.scrollTop + 24;
        let currentHeading = headings[0];
        headings.forEach((heading) => {
          const headingTop = heading.offsetTop - noteContent.offsetTop;
          if (headingTop <= currentTop) {
            currentHeading = heading;
          }
        });
        if (currentHeading) {
          setActiveLink(currentHeading.id);
        }
      };
      let tocScrollTicking = false;
      tocScrollHandler = () => {
        if (tocScrollTicking) return;
        tocScrollTicking = true;
        window.requestAnimationFrame(() => {
          updateActiveFromScroll();
          tocScrollTicking = false;
        });
      };
      noteContent.addEventListener("scroll", tocScrollHandler, { passive: true });
      tocObserver = new IntersectionObserver((entries) => {
        const visible = entries
          .filter((entry) => entry.isIntersecting)
          .sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top)[0];
        if (!visible) return;
        setActiveLink(visible.target.id);
      }, { root: noteContent, rootMargin: "-12% 0px -70% 0px", threshold: 0.01 });
      headings.forEach((heading) => tocObserver.observe(heading));
      updateActiveFromScroll();
    }

    function setCourseNoteLanguage(lang) {
      noteContent.querySelectorAll(".zh").forEach((section) => {
        section.style.display = lang === "zh" ? "block" : "none";
      });
      noteContent.querySelectorAll(".en").forEach((section) => {
        section.style.display = lang === "en" ? "block" : "none";
      });
      noteContent.querySelectorAll("[data-note-lang]").forEach((button) => {
        button.classList.toggle("active", button.dataset.noteLang === lang);
      });
      buildToc();
      typesetNoteContent();
    }

    function initCourseNoteLanguageControls() {
      noteContent.querySelectorAll("[data-note-lang]").forEach((button) => {
        button.addEventListener("click", () => setCourseNoteLanguage(button.dataset.noteLang));
      });
      setCourseNoteLanguage("zh");
    }

    async function typesetNoteContent() {
      if (!window.MathJax) return;
      try {
        if (MathJax.startup && MathJax.startup.promise) await MathJax.startup.promise;
        if (MathJax.texReset) MathJax.texReset();
        if (MathJax.typesetClear) MathJax.typesetClear([noteContent]);
        await MathJax.typesetPromise([noteContent]);
      } catch (err) {}
    }

    async function renderNote() {
      const id = new URLSearchParams(window.location.search).get("id") || "trustworthy-gai";
      const note = notes[id];
      if (!note) {
        noteTitle.textContent = "Course Note Not Found";
        noteContent.innerHTML = "<p>Sorry, this course note does not exist or has been removed.</p>";
        return;
      }

      document.title = `${note.title} - Can Zheng`;
      noteTitle.textContent = note.title;
      noteTags.innerHTML = note.tags.map(tag => `<span class="note-tag">${escapeHtml(tag)}</span>`).join("");
      noteContent.scrollTop = 0;

      if (note.file.toLowerCase().endsWith(".pdf")) {
        window.location.replace(note.file);
        return;
      }

      try {
        const res = await fetch(note.file);
        if (!res.ok) throw new Error(`Failed to load ${note.file}`);
        const markdown = await res.text();
        const { masked, chunks } = extractMath(markdown);
        noteContent.innerHTML = restoreMath(marked.parse(masked), chunks);
        noteContent.scrollTop = 0;
        initCourseNoteLanguageControls();
        await new Promise(requestAnimationFrame);
        await typesetNoteContent();
      } catch (err) {
        noteContent.innerHTML = `<p style="color:red;">${escapeHtml(err.message)}</p>`;
      }
    }

    document.getElementById("year").textContent = new Date().getFullYear();
    renderNote();
    window.Site && window.Site.init({ titles: { zh: "课程笔记", en: "Course Notes" } });
  </script>
</body>
